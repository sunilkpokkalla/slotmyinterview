events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream slotmyinterview_api_cluster {
        least_conn; # Distribute load to API instance with least active connections
        server api:5000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name api.slotmyinterview.com localhost;

        client_max_body_size 10M;

        # Gzip Compression
        gzip on;
        gzip_types text/plain application/json application/javascript text/css application/xml;

        # Healthcheck passthrough
        location /health {
            proxy_pass http://slotmyinterview_api_cluster/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            access_log off;
        }

        # Swagger Docs
        location /api-docs {
            proxy_pass http://slotmyinterview_api_cluster/api-docs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API Routes
        location / {
            proxy_pass http://slotmyinterview_api_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}


version: "3.8"

services:
  # ========================================================
  # Primary PostgreSQL Database
  # ========================================================
  postgres:
    image: postgres:16-alpine
    container_name: slotmyinterview_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: slotmyinterview
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - slotmyinterview_net

  # ========================================================
  # Redis (Caching, Rate Limiting, BullMQ Queues)
  # ========================================================
  redis:
    image: redis:7-alpine
    container_name: slotmyinterview_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "volatile-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - slotmyinterview_net

  # ========================================================
  # Stateless Express REST API Servers (Horizontally Scalable)
  # ========================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/slotmyinterview?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      API_BASE_URL: http://localhost:5000
      FRONTEND_URL: http://localhost:3000
      JWT_ACCESS_SECRET: prod_access_secret_super_secure_key_slotmyinterview_2026
      JWT_REFRESH_SECRET: prod_refresh_secret_super_secure_key_slotmyinterview_2026
      EMAIL_PROVIDER: resend
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      FROM_EMAIL: notifications@slotmyinterview.com
      STORAGE_PROVIDER: local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    networks:
      - slotmyinterview_net
    deploy:
      replicas: 3 # Horizontally scale to 3 stateless web instances
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M

  # ========================================================
  # BullMQ Background Job Workers (Decoupled & Scalable)
  # ========================================================
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "dist/workers/index.js"]
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/slotmyinterview?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      EMAIL_PROVIDER: resend
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      FROM_EMAIL: notifications@slotmyinterview.com
      FRONTEND_URL: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - slotmyinterview_net
    deploy:
      replicas: 2 # Horizontally scale background workers independently
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          cpus: "0.2"
          memory: 256M

  # ========================================================
  # Nginx Reverse Proxy / Horizontal Load Balancer
  # ========================================================
  nginx:
    image: nginx:alpine
    container_name: slotmyinterview_lb
    restart: always
    ports:
      - "5000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - slotmyinterview_net

volumes:
  postgres_data:
  redis_data:
  uploads_data:

networks:
  slotmyinterview_net:
    driver: bridge


apiVersion: apps/v1
kind: Deployment
metadata:
  name: slotmyinterview-worker
  namespace: production
  labels:
    app: slotmyinterview-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: slotmyinterview-worker
  template:
    metadata:
      labels:
        app: slotmyinterview-worker
    spec:
      containers:
        - name: worker
          image: slotmyinterview/backend:latest
          command: ["node", "dist/workers/index.js"]
          envFrom:
            - configMapRef:
                name: slotmyinterview-config
            - secretRef:
                name: slotmyinterview-secrets
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: slotmyinterview-worker-hpa
  namespace: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: slotmyinterview-worker
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75

